{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login</title>

<!-- Registration section is embedded on this login page -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 420px; margin-top: 90px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Sign in</h4>

        {% if form.errors %}
          <div class="alert alert-danger">
            Invalid username or password.
          </div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input class="form-control" type="text" name="username" autofocus required id="id_username" />
          </div>

          <div class="mb-3">
            <label class="form-label" for="id_password">Password</label>
            <input class="form-control" type="password" name="password" required id="id_password" />
          </div>

          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>

        {% if next %}
          <input type="hidden" name="next" value="{{ next }}" />
        {% endif %}

        <p class="text-muted small mt-3 mb-0">
          Use your company credentials.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
