<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f5f7fb; }
        .card { border-radius: 12px; }
    </style>
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h3>Products</h3>
        <a href="/stock/product/add/" class="btn btn-primary">+ Add Product</a>
    </div>

    <div class="card p-3 shadow-sm">

        <!-- SEARCH -->
        <form method="get" class="mb-3">
            <input type="text" name="q" class="form-control"
                   placeholder="Search SKU / Material Code / Name"
                   value="{{ query }}">
        </form>

        <!-- TABLE -->
        <table class="table table-bordered table-hover text-center">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>SKU</th>
                    <th>Material Code</th>
                    <th>Color</th>
                    <th>Size</th>
                    <th>Stock</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for p in products %}
                <tr>
                    <td>{{ p.name }}</td>
                    <td>{{ p.sku }}</td>
                    <td>{{ p.material_code }}</td>
                    <td>{{ p.color }}</td>
                    <td>{{ p.size }}</td>
                    <td>{{ p.stock }}</td>
                    <td>{{ p.selling_price }}</td>

                    <td>
                        <a href="/stock/product/edit/{{ p.id }}/" class="btn btn-sm btn-warning">Edit</a>
                        <a href="/stock/product/delete/{{ p.id }}/"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this product?')">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>
<script>

document.addEventListener('change', function(e) {

    if (e.target.classList.contains('sku-input')) {

        let row = e.target.closest('tr');
        let sku = e.target.value;

        fetch(`/api/get-product-by-sku/?sku=${sku}`)
        .then(res => res.json())
        .then(data => {

            if (data.id) {

                let productDropdown = row.querySelector('select');
                productDropdown.value = data.id;

                let priceInput = row.querySelector('input[name$="price"]');
                priceInput.value = data.price;

            } else {
                alert("Invalid SKU");
            }

        });

    }

});

</script>

</body>
</html>
