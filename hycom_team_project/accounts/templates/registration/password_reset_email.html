<p>Hi {{ user.get_username }},</p>
<p>Someone requested a password reset for your account at {{ site_name }}.</p>
<p>If this was you, click the link below to set a new password:</p>
<p><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">Reset password</a></p>
<p>If you did not request this, you can ignore this email.</p>
<p>Thanks,<br/>{{ site_name }}</p>
