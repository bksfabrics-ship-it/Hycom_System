<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Reset Complete</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 520px; margin-top: 80px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Password updated</h4>
        <p class="text-muted">You can now sign in with your new password.</p>
        <a href="{% url 'login' %}" class="btn btn-primary w-100">Go to login</a>
      </div>
    </div>
  </div>
</body>
</html>
