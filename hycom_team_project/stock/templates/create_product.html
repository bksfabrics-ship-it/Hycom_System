{% extends 'base.html' %}

{% block content %}

<h3>Add Product</h3>

<form method="post">
    {% csrf_token %}

    <div class="row g-3">

        <!-- BASIC INFO -->
        <div class="col-md-3">
            <label>Product Name</label>
            {{ form.name }}
        </div>

        <div class="col-md-3">
            <label>SKU</label>
            {{ form.sku }}
        </div>

        <div class="col-md-3">
            <label>Material Code</label>
            {{ form.material_code }}
        </div>

        <div class="col-md-3">
            <label>Style</label>
            {{ form.style }}
        </div>

        <!-- ATTRIBUTES -->
        <div class="col-md-3">
            <label>Gender</label>
            {{ form.gender }}
        </div>

        <div class="col-md-3">
            <label>Color</label>
            {{ form.color }}
        </div>

        <div class="col-md-3">
            <label>Size</label>
            {{ form.size }}
        </div>

        <div class="col-md-3">
            <label>Category</label>
            {{ form.category }}
        </div>

        <!-- BUSINESS -->
        <div class="col-md-3">
            <label>Stock</label>
            {{ form.stock }}
        </div>

        <div class="col-md-3">
            <label>Selling Price</label>
            {{ form.selling_price }}
        </div>

        <!-- CHECKBOX (ALIGNED LIKE ORDER PAGE) -->
        <div class="col-md-3 mt-4 d-flex align-items-center">
            <div class="form-check">
                {{ form.is_active }}
                <label class="form-check-label ms-2">Active</label>
            </div>
        </div>

    </div>

    <div class="mt-4">
        <button type="submit" class="btn btn-success">Save Product</button>
    </div>

</form>

{% endblock %}
