{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h4>User Management</h4>
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Permissions</th>
                    </tr>
                </thead>

                <tbody>

                    {% for user in users %}

                    <tr>
                        <td>{{ user.username }}</td>
                        <td>{{ user.email }}</td>

                        <td>
                            <a href="{% url 'manage_permissions' user.id %}"
                               class="btn btn-primary btn-sm">

                               Manage Permissions

                            </a>
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
