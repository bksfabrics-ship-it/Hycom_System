<!DOCTYPE html>
<html>
<head>
    <style>
        @media (max-width: 768px) {
            .col-md-3, .col-md-4 {
                width: 100%;
            }
        }
        input:not([type="checkbox"]),
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        /* Checkbox FIX */
        input[type="checkbox"] {
            width: auto !important;
            transform: scale(1.2);
        }
    label {
        font-weight: 500;
        margin-bottom: 4px;
    }
</style>
    <title>Hycom System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f5f7fb;
        }

        .sidebar {
            width: 220px;
            height: 100vh;
            position: fixed;
            background: #1f2937;
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: #cbd5e1;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #374151;
            color: white;
        }

        .sidebar h4 {
            text-align: center;
            margin-bottom: 20px;
        }

        .content {
            margin-left: 220px;
            padding: 20px;
        }
        .form-check input[type="checkbox"] {
        display: inline-block !important;
        width: auto !important;
        visibility: visible !important;
        opacity: 1 !important;
        }
        .table th, .table td {
        padding: 12px 14px;
        vertical-align: middle;
        white-space: nowrap;
        }

        .table thead {
            background-color: #f8f9fa;
        }

        .table tbody tr:hover {
            background-color: #f1f5ff;
        }

        .table thead th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 2;
        }
        .table td:first-child,
        .table th:first-child {
            position: sticky;
            left: 0;
            background: white;
            z-index: 1;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h4>Hycom</h4>

    <a href="/api/">📊 Dashboard</a>
    <a href="/api/order_list/">📦 Orders</a>
    <a href="/stock/products/">🧾 Products</a>
    
    <hr style="border-color:#374151;">

    <div style="padding-left:20px; font-size:12px; color:#9ca3af;">
        REPORTS
    </div>

    <a href="/reports/orders/">📊 Order Report</a>
    <a href="/reports/returns/">🔁 Return Report</a>
    <a href="/reports/stock/">📦 Stock Report</a>
</div>

<!-- MAIN CONTENT -->
<div class="content">
    {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
