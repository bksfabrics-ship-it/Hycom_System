{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Add Product</h3>
        <a href="/stock/products/" class="btn btn-secondary">
            View Products
        </a>
    </div>

    <!-- CARD -->
    <div class="card shadow-sm p-4">

        <form method="post">
            {% csrf_token %}

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Product Name</label>
                    {{ form.name }}
                </div>

                <div class="col-md-4">
                    <label class="form-label">SKU</label>
                    {{ form.sku }}
                </div>

                <div class="col-md-4">
                    <label class="form-label">Material Code (SAP)</label>
                    {{ form.material_code }}
                </div>

                <div class="col-md-3">
                    <label class="form-label">Color</label>
                    {{ form.color }}
                </div>

                <div class="col-md-3">
                    <label class="form-label">Size</label>
                    {{ form.size }}
                </div>

                <div class="col-md-3">
                    <label class="form-label">Category</label>
                    {{ form.category }}
                </div>

                <div class="col-md-3">
                    <label class="form-label">Stock</label>
                    {{ form.stock }}
                </div>

                <div class="col-md-4">
                    <label class="form-label">Selling Price</label>
                    {{ form.selling_price }}
                </div>

                <div class="col-md-4">
                    <label class="form-label">Active</label>
                    {{ form.is_active }}
                </div>

            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success">
                    Save Product
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
